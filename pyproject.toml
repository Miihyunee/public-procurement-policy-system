[build-system]
requires = ["setuptools>=72", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "public-procurement-policy-system"
version = "0.1.0"
description = "공공기관 우선구매 정책 달성률 자동 계산 시스템"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"

authors = [
    { name = "Public Procurement Policy System Team" }
]

keywords = ["procurement", "public-policy", "government", "korea", "sme"]

classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Government",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # 표준 업로드 양식 .xlsx 읽기·쓰기 (2026-08-16 PM 승인 §11).
    # 순수 파이썬 패키지라 폐쇄망에서도 wheel 하나로 설치된다.
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",
]

[project.scripts]
procurement = "procurement.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

# Dashboard 정적 페이지를 패키지에 포함한다(템플릿 엔진을 도입하지 않기 위해
# HTML 파일을 그대로 읽어 반환한다).
[tool.setuptools.package-data]
procurement = ["web/static/*.html"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "ANN", "N"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.lint.isort]
known-first-party = ["procurement"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

# openpyxl 은 타입 스텁을 제공하지 않는다. 스텁 패키지(types-openpyxl)를 새
# 의존성으로 추가하는 대신 이 모듈만 예외로 둔다. 우리 코드의 strict 검사는
# 그대로 유지되며, 어댑터 경계에서 값 타입을 직접 좁혀 쓰고 있다.
[[tool.mypy.overrides]]
module = ["openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -v"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
