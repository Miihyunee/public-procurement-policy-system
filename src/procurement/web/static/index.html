<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>우선구매 정책 달성률 대시보드</title>
<!-- 외부 요청을 만들지 않기 위해 빈 favicon 을 지정한다. -->
<link rel="icon" href="data:," />
<style>
  /* ------------------------------------------------------------------
     테마 토큰
     라이트/다크 두 벌만 정의하고, 이후 모든 색은 변수로만 참조한다.
     ------------------------------------------------------------------ */
  :root[data-theme="dark"] {
    --bg: #080b10;
    --card: #121820;
    --card-soft: #182029;
    --line: #232d39;
    --text: #e9eef5;
    --muted: #8493a5;
    --accent: #6fe3cf;
    --accent-soft: rgba(111, 227, 207, .16);
    --normal: #4ade80;
    --warning: #fbbf24;
    --shortage: #fb7185;
    --unset: #64748b;
    --track: #1e2731;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    --chip-bg: rgba(255, 255, 255, .05);
  }
  :root[data-theme="light"] {
    --bg: #eef1f5;
    --card: #ffffff;
    --card-soft: #f5f7fa;
    --line: #e2e7ee;
    --text: #16202b;
    --muted: #64748b;
    --accent: #0e9d8b;
    --accent-soft: rgba(14, 157, 139, .12);
    --normal: #12915d;
    --warning: #b06f00;
    --shortage: #d1435b;
    --unset: #8593a6;
    --track: #e8ecf2;
    --shadow: 0 1px 2px rgba(16, 32, 48, .06);
    --chip-bg: rgba(16, 32, 48, .04);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    transition: background .18s ease, color .18s ease;
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 22px 20px 56px; }

  /* ---------------------------------------------------------- 상단 바 */
  .topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .title { font-size: 19px; font-weight: 700; letter-spacing: -.01em; margin: 0; }
  .spacer { flex: 1 1 auto; }
  .badge {
    padding: 4px 11px; border-radius: 999px; font-size: 11px; font-weight: 700;
    letter-spacing: .06em; border: 1px solid transparent;
  }
  .badge-demo { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .badge-op { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .control {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 7px 11px; color: var(--text); font-size: 13px; box-shadow: var(--shadow);
  }
  .control select {
    background: transparent; border: 0; color: var(--text);
    font-size: 13px; font-family: inherit; outline: none; cursor: pointer;
  }
  .control select option { background: var(--card); color: var(--text); }
  button.control { cursor: pointer; font-family: inherit; }
  button.control:hover { border-color: var(--accent); color: var(--accent); }
  .control-label { color: var(--muted); }

  /* -------------------------------------------------------- 업로드 */
  .upload-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .upload-file {
    margin-top: 10px; font-size: 12.5px; color: var(--muted);
    word-break: break-all;
  }
  .upload-summary { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .upload-stat {
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px;
    font-size: 12.5px; background: var(--card);
  }
  .upload-stat b { font-size: 15px; }
  .upload-issues {
    margin-top: 12px; max-height: 260px; overflow: auto;
    border: 1px solid var(--line); border-radius: 10px;
  }
  .upload-issues table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .upload-issues th, .upload-issues td {
    text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  .upload-issues td.msg { white-space: normal; }
  .upload-issues th { color: var(--muted); font-weight: 600; position: sticky; top: 0;
    background: var(--card); }
  .upload-issues tr:last-child td { border-bottom: 0; }
  .sev-error { color: #e11d48; font-weight: 700; }
  .sev-warning { color: #d97706; font-weight: 700; }

  /* ------------------------------------------------------------ 알림 */
  .notice, .error {
    margin-top: 14px; padding: 10px 14px; border-radius: 10px; font-size: 12.5px;
    border: 1px solid var(--line); background: var(--card); color: var(--muted);
  }
  .notice::before { content: "ⓘ "; color: var(--accent); }
  .error { border-color: var(--shortage); color: var(--shortage); }

  /* ------------------------------------------------------------ 레이아웃 */
  .row { display: grid; gap: 14px; margin-top: 14px; }
  .row-kpi { grid-template-columns: 2fr 1fr; }
  .row-mid { grid-template-columns: 1.6fr 1fr; }
  .row-bottom { grid-template-columns: 320px 1fr; }
  @media (max-width: 940px) {
    .row-kpi, .row-mid, .row-bottom { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 18px; box-shadow: var(--shadow);
    display: flex; flex-direction: column;
  }
  /* 나란히 놓인 카드의 높이가 달라도 내부 여백이 비지 않도록 늘린다. */
  .card > .kpi-grid, .card > .policy-grid { flex: 1 1 auto; }
  .card-title { font-size: 15px; font-weight: 700; margin: 0; }
  .card-sub { font-size: 12px; color: var(--muted); margin: 2px 0 0; }
  .card-head { display: flex; align-items: flex-start; gap: 10px; }

  /* -------------------------------------------------------- KPI 타일 */
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 16px; }
  @media (max-width: 720px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
  .kpi {
    background: var(--card-soft); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px;
  }
  .kpi-icon {
    width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent); margin-bottom: 12px;
  }
  .kpi-value { font-size: 21px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; }
  .kpi-unit { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 3px; }
  .kpi-label { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .kpi-foot { font-size: 11px; color: var(--muted); margin-top: 7px; }

  /* -------------------------------------------------------- 순위 리스트 */
  .rank { width: 100%; border-collapse: collapse; margin-top: 12px; }
  .rank th {
    font-size: 11.5px; font-weight: 500; color: var(--muted); text-align: left;
    padding: 6px 8px; border-bottom: 1px solid var(--line);
  }
  .rank td { padding: 11px 8px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .rank tr:last-child td { border-bottom: 0; }
  .rank .idx { color: var(--muted); width: 34px; font-variant-numeric: tabular-nums; }
  .rank .bar-cell { width: 45%; }
  .rank .val { text-align: right; width: 92px; }
  .pill {
    display: inline-block; min-width: 62px; text-align: center;
    padding: 3px 9px; border-radius: 8px; font-size: 12px; font-weight: 700;
    border: 1px solid currentColor; background: var(--chip-bg);
  }
  .track { height: 6px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .track > span { display: block; height: 100%; border-radius: 999px; }

  /* ---------------------------------------------------------- 상태 표 */
  .kv { width: 100%; border-collapse: collapse; margin-top: 10px; }
  .kv th {
    font-weight: 500; color: var(--muted); text-align: left;
    padding: 8px 0; font-size: 13px; border-bottom: 1px solid var(--line);
  }
  .kv td {
    text-align: right; padding: 8px 0; font-size: 13px;
    font-variant-numeric: tabular-nums; border-bottom: 1px solid var(--line);
  }
  .kv tr:last-child th, .kv tr:last-child td { border-bottom: 0; }

  /* -------------------------------------------------------- 정책 카드 */
  .policy-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .policy {
    background: var(--card-soft); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px;
  }
  .policy-head { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .policy-name { font-weight: 700; font-size: 14px; }
  .policy-code { font-size: 11px; color: var(--muted); }
  .chip {
    font-size: 10.5px; padding: 2px 8px; border-radius: 999px;
    background: var(--chip-bg); border: 1px solid var(--line); color: var(--muted);
  }
  .chip-ready { color: var(--accent); border-color: var(--accent); }
  .policy-value { font-size: 25px; font-weight: 700; letter-spacing: -.02em; margin-top: 10px; }
  .policy-state { font-size: 12px; margin-top: 1px; }
  .st-NORMAL { color: var(--normal); }
  .st-WARNING { color: var(--warning); }
  .st-SHORTAGE { color: var(--shortage); }
  .st-TARGET_RATE_NOT_SET, .st-HOLD { color: var(--unset); }
  .policy dl {
    display: grid; grid-template-columns: auto 1fr; gap: 5px 10px;
    margin: 12px 0 0; font-size: 12.5px;
  }
  .policy dt { color: var(--muted); }
  .policy dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .policy .note {
    margin: 11px 0 0; padding-top: 10px; border-top: 1px solid var(--line);
    font-size: 11.5px; color: var(--muted);
  }

  .legend { display: flex; gap: 16px; justify-content: center; margin-top: 12px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; }
  .empty { color: var(--muted); font-size: 12.5px; padding: 26px 0; text-align: center; }
  .foot-note { font-size: 11.5px; color: var(--muted); margin: 12px 0 0; }
  footer { margin-top: 22px; font-size: 11.5px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <h1 class="title">우선구매 정책 달성률 대시보드</h1>
    <span id="data-mode-badge" class="badge badge-demo">DATA MODE</span>
    <span class="spacer"></span>
    <span class="control">
      <span class="control-label">연도</span>
      <select id="year-select" aria-label="대상 연도 선택"></select>
    </span>
    <button id="theme-toggle" class="control" type="button" aria-label="테마 전환">
      <span id="theme-icon">☾</span><span id="theme-label">다크</span>
    </button>
  </div>

  <div id="period-notice" class="notice">기간 필터 미적용 — 전체 데이터 기준입니다.</div>
  <div id="error-box" class="error" hidden></div>

  <!-- 1. KPI + 적재 건수 -->
  <div class="row row-kpi">
    <section class="card">
      <div class="card-head">
        <div>
          <h2 class="card-title">데이터 요약</h2>
          <p class="card-sub">전체 데이터 기준 (기간 필터 미적용)</p>
        </div>
      </div>
      <div id="kpi-grid" class="kpi-grid"></div>
    </section>

    <section class="card">
      <h2 class="card-title">적재 데이터 건수</h2>
      <div id="chart-volume"></div>
    </section>
  </div>

  <!-- 2. 달성률 순위 + 적재 현황 표 -->
  <div class="row row-mid">
    <section class="card">
      <h2 class="card-title">정책별 달성률</h2>
      <p class="card-sub">목표율이 등록되고 계산이 가능한 정책만 표시합니다</p>
      <div id="summary-error" class="error" hidden></div>
      <div id="chart-achievement"></div>
    </section>

    <section class="card">
      <h2 class="card-title">데이터 적재 현황</h2>
      <table class="kv"><tbody id="status-table"></tbody></table>
      <p class="foot-note" id="status-note"></p>
    </section>
  </div>

  <!-- 3. 매칭률 게이지 + 정책 카드 -->
  <div class="row row-bottom">
    <section class="card">
      <h2 class="card-title">기업 매칭률</h2>
      <p class="card-sub">구매 건 중 기업 정보가 연결된 비율</p>
      <div id="chart-gauge"></div>
    </section>

    <section class="card">
      <h2 class="card-title">정책별 현황</h2>
      <p class="card-sub">개발 상태는 docs/DECISIONS.md 의 결정을 그대로 표시합니다</p>
      <div id="policy-cards" class="policy-grid" style="margin-top:14px"></div>
    </section>
  </div>

  <!-- 4. 구매실적 업로드 (데스크톱 앱 전용) -->
  <div class="row" style="margin-top:16px">
    <section class="card" style="flex:1 1 100%">
      <div class="card-head">
        <div>
          <h2 class="card-title">구매실적 업로드</h2>
          <p class="card-sub">표준 양식을 내려받아 채운 뒤 올리면 전체 행을 검증합니다</p>
        </div>
      </div>

      <div class="upload-actions">
        <button id="upload-template" class="control" type="button">표준 양식 다운로드</button>
        <button id="upload-pick" class="control" type="button">파일 선택</button>
        <span class="control">
          <span class="control-label">대상 연도</span>
          <select id="upload-year" aria-label="업로드 대상 연도 선택"></select>
        </span>
        <button id="upload-run" class="control" type="button" disabled>검증만</button>
        <button id="upload-save" class="control" type="button" disabled>검증 후 저장</button>
      </div>

      <div id="upload-file" class="upload-file">선택된 파일이 없습니다.</div>
      <div id="upload-notice" class="notice" hidden></div>
      <div id="upload-error" class="error" hidden></div>
      <div id="upload-summary" class="upload-summary" hidden></div>
      <div id="upload-issues" class="upload-issues" hidden></div>
    </section>
  </div>

  <footer id="footer-note"></footer>
</div>

<script>
(function () {
  "use strict";

  // 표시 전용 구간 색(낮은 구간 → 높은 구간). 기존 상태 색과 별개 체계다.
  var LEVEL_COLOR = [
    "#e11d48", "#f97316", "#eab308", "#84cc16", "#22c55e", "#14b8a6"
  ];

  var THEME_KEY = "procurement.dashboard.theme";
  var SVG_NS = "http://www.w3.org/2000/svg";

  var el = function (id) { return document.getElementById(id); };
  function text(node, value) { node.textContent = value; }
  function clear(node) { while (node.firstChild) { node.removeChild(node.firstChild); } }

  function make(tag, className, content) {
    var node = document.createElement(tag);
    if (className) { node.className = className; }
    if (content !== undefined) { node.textContent = content; }
    return node;
  }

  function svg(tag, attrs) {
    var node = document.createElementNS(SVG_NS, tag);
    Object.keys(attrs).forEach(function (key) { node.setAttribute(key, attrs[key]); });
    return node;
  }

  function cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function numberFormat(value) {
    if (value === null || value === undefined || value === "") { return "-"; }
    var parts = String(value).split(".");
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    return parts.join(".");
  }

  /** 큰 금액을 억/만 단위로 요약한다(정확한 값은 타일 하단·표에 그대로 표시된다). */
  function compactAmount(value) {
    var n = Number(value);
    if (!isFinite(n)) { return { value: "-", unit: "" }; }
    if (n >= 100000000) {
      return { value: numberFormat((n / 100000000).toFixed(1)), unit: "억원" };
    }
    if (n >= 10000) {
      return { value: numberFormat(Math.round(n / 10000)), unit: "만원" };
    }
    return { value: numberFormat(n), unit: "원" };
  }

  function fetchJson(url) {
    return fetch(url, { headers: { "Accept": "application/json" } }).then(function (res) {
      if (res.ok) { return res.json(); }
      // 서버가 이유(detail)를 주면 그대로 보여준다. 503(연도 귀속 기준일 미확정)
      // 같은 상태를 "HTTP 503" 으로만 표시하면 사용자가 원인을 알 수 없다.
      return res.json().then(function (body) {
        var detail = body && body.detail ? String(body.detail) : "";
        throw new Error(detail || (url + " 응답 오류 (HTTP " + res.status + ")"));
      }, function () {
        throw new Error(url + " 응답 오류 (HTTP " + res.status + ")");
      });
    });
  }

  // ------------------------------------------------------------------ 테마
  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    text(el("theme-icon"), theme === "dark" ? "☾" : "☀");
    text(el("theme-label"), theme === "dark" ? "다크" : "라이트");
  }

  function initTheme() {
    var stored = null;
    try { stored = window.localStorage.getItem(THEME_KEY); } catch (e) { stored = null; }
    // 저장된 선택이 없으면 다크를 기본으로 한다(화면 기본 스타일).
    applyTheme(stored === "light" ? "light" : "dark");

    el("theme-toggle").addEventListener("click", function () {
      var next = document.documentElement.getAttribute("data-theme") === "dark"
        ? "light" : "dark";
      applyTheme(next);
      try { window.localStorage.setItem(THEME_KEY, next); } catch (e) { /* 저장 실패 무시 */ }
      redraw();
    });
  }

  // ------------------------------------------------------------- 연도 선택
  function buildYearOptions() {
    var select = el("year-select");
    var current = new Date().getFullYear();
    for (var y = current + 1; y >= current - 3; y--) {
      var opt = document.createElement("option");
      opt.value = String(y);
      opt.textContent = y + "년";
      if (y === current) { opt.selected = true; }
      select.appendChild(opt);
    }
    select.addEventListener("change", load);
  }

  // ------------------------------------------------------------------ KPI
  var ICON = {
    amount: "₩",
    count: "▤",
    match: "⇄",
    target: "◎"
  };

  function kpiTile(icon, value, unit, label, foot) {
    var tile = make("div", "kpi");
    tile.appendChild(make("div", "kpi-icon", icon));
    var v = make("div", "kpi-value");
    v.appendChild(document.createTextNode(value));
    if (unit) { v.appendChild(make("span", "kpi-unit", unit)); }
    tile.appendChild(v);
    tile.appendChild(make("div", "kpi-label", label));
    if (foot) { tile.appendChild(make("div", "kpi-foot", foot)); }
    return tile;
  }

  function renderKpi(status) {
    var grid = el("kpi-grid");
    clear(grid);

    var amount = compactAmount(status.purchase_total_amount);
    var matchRate = status.purchase_count
      ? Math.round((status.matched_purchase_count / status.purchase_count) * 1000) / 10
      : null;

    grid.appendChild(kpiTile(
      ICON.amount, amount.value, amount.unit, "총 구매금액",
      numberFormat(status.purchase_total_amount) + " 원"));
    grid.appendChild(kpiTile(
      ICON.count, numberFormat(status.purchase_count), "건", "구매 건수",
      status.earliest_payment_date
        ? status.earliest_payment_date + " ~ " + status.latest_payment_date
        : "적재된 데이터 없음"));
    grid.appendChild(kpiTile(
      ICON.match, matchRate === null ? "-" : matchRate, matchRate === null ? "" : "%",
      "기업 매칭률",
      numberFormat(status.matched_purchase_count) + " / " +
      numberFormat(status.purchase_count) + " 건"));
    grid.appendChild(kpiTile(
      ICON.target,
      numberFormat(status.policy_with_target_rate_count) + " / " + numberFormat(status.policy_count),
      "종", "목표율 설정 정책",
      status.policy_with_target_rate_count === 0 ? "공식 근거 확정 전까지 미등록" : ""));
  }

  // ------------------------------------------------------------ 적재 현황 표
  function renderStatusTable(status) {
    var badge = el("data-mode-badge");
    var operational = status.data_mode === "operational";
    badge.className = operational ? "badge badge-op" : "badge badge-demo";
    text(badge, operational ? "OPERATIONAL DATA" : "DEMO / SAMPLE DATA");

    text(el("period-notice"), status.period_notice);

    var range = function (from, to) { return (from && to) ? (from + " ~ " + to) : "-"; };
    var rows = [
      ["구매 건수", numberFormat(status.purchase_count) + " 건"],
      ["구매금액 합계", numberFormat(status.purchase_total_amount) + " 원"],
      ["기업 매칭 완료", numberFormat(status.matched_purchase_count) + " 건"],
      ["기업 미매칭", numberFormat(status.unmatched_purchase_count) + " 건"],
      ["지급일 범위", range(status.earliest_payment_date, status.latest_payment_date)],
      ["계약일 범위", range(status.earliest_contract_date, status.latest_contract_date)],
      ["기업 수", numberFormat(status.company_count) + " 건"],
      ["인증 정보", numberFormat(status.certification_count) + " 건"],
      ["등록 정책", numberFormat(status.policy_count) + " 종"],
      ["업로드 배치 (사용 / 대체)",
        numberFormat(status.active_batch_count) + " / "
        + numberFormat(status.superseded_batch_count) + " 건"],
      ["계산 대상 구매", numberFormat(status.calculation_target_count) + " 건"]
    ];

    var tbody = el("status-table");
    clear(tbody);
    rows.forEach(function (row) {
      var tr = document.createElement("tr");
      tr.appendChild(make("th", null, row[0]));
      tr.appendChild(make("td", null, row[1]));
      tbody.appendChild(tr);
    });

    var note;
    if (status.purchase_count === 0) {
      note = "업로드된 구매 데이터가 없습니다. 데이터를 적재하기 전까지 달성률은 계산되지 않습니다.";
    } else if (!status.period_filter_available) {
      note = "연도 귀속 기준일이 확정되지 않아 선택한 연도("
        + (status.requested_year || "-") + ")가 조회 조건으로 사용되지 않습니다.";
    } else {
      note = "달성률은 " + (status.requested_year || "-")
        + "년(" + status.period_date_field + " 기준)으로 계산됩니다.";
    }
    if (status.superseded_batch_count > 0) {
      note += " 재업로드로 대체된 배치 " + status.superseded_batch_count
        + "건의 " + numberFormat(status.purchase_count - status.calculation_target_count)
        + "행은 계산에서 제외됩니다.";
    }
    text(el("status-note"), note);
  }

  // ------------------------------------------------------------ 정책 카드
  function policyCard(item, display) {
    var card = make("div", "policy");

    var head = make("div", "policy-head");
    head.appendChild(make("span", "policy-name", item.policy_name));
    head.appendChild(make("span", "policy-code", item.policy_code));
    var onHold = !!display && display.development_status === "ON_HOLD";
    if (display) {
      head.appendChild(make("span", onHold ? "chip" : "chip chip-ready", display.development_label));
    }
    card.appendChild(head);

    var value = make("div", "policy-value");
    var state = make("div", "policy-state");
    if (onHold) {
      value.className += " st-HOLD";
      text(value, "—");
      state.className += " st-HOLD";
      text(state, "계산 보류");
    } else if (item.achievement_rate === null) {
      value.className += " st-TARGET_RATE_NOT_SET";
      text(value, "—");
      state.className += " st-TARGET_RATE_NOT_SET";
      text(state, item.status_label);
    } else {
      var level = levelOf(item.achievement_rate);
      text(value, item.achievement_rate + "%");
      value.style.color = levelColor(level);
      text(state, "달성률 · " + (level ? level.label : item.status_label));
      state.style.color = levelColor(level);
    }
    card.appendChild(value);
    card.appendChild(state);

    var dl = document.createElement("dl");
    [
      ["목표 구매비율", item.target_rate === null ? "미설정" : item.target_rate + "%"],
      ["정책 구매액", item.purchase_amount === null
        ? "미계산" : numberFormat(item.purchase_amount) + " 원"],
      ["부족률", item.shortage_rate === null ? "-" : item.shortage_rate + "%"]
    ].forEach(function (pair) {
      dl.appendChild(make("dt", null, pair[0]));
      dl.appendChild(make("dd", null, pair[1]));
    });
    card.appendChild(dl);

    var reason = "";
    if (onHold) { reason = display.note; }
    else if (item.target_rate === null) {
      reason = "목표율이 등록되지 않아 달성률을 계산하지 않았습니다(0% 아님).";
    } else if (display && display.note) { reason = display.note; }
    if (reason) { card.appendChild(make("p", "note", reason)); }

    return card;
  }

  function renderPolicies(summary, displayMap) {
    var container = el("policy-cards");
    clear(container);
    if (!summary.policies.length) {
      container.appendChild(make("div", "empty", "표시할 정책이 없습니다. DB 초기화(seed)가 필요합니다."));
      return;
    }
    summary.policies.forEach(function (item) {
      container.appendChild(policyCard(item, displayMap[item.policy_code]));
    });
  }

  /** 계산 결과가 없을 때 — 정책과 개발 상태만 표시한다(숫자를 지어내지 않는다). */
  function renderPoliciesWithoutCalculation(displayMap) {
    var container = el("policy-cards");
    clear(container);
    Object.keys(displayMap).forEach(function (code) {
      var display = displayMap[code];
      var card = make("div", "policy");
      var head = make("div", "policy-head");
      head.appendChild(make("span", "policy-name", code));
      head.appendChild(make("span", "chip", display.development_label));
      card.appendChild(head);
      card.appendChild(make("div", "policy-value st-TARGET_RATE_NOT_SET", "\u2014"));
      card.appendChild(make("div", "policy-state st-TARGET_RATE_NOT_SET", "계산 불가"));
      if (display.note) { card.appendChild(make("p", "note", display.note)); }
      container.appendChild(card);
    });
  }

  // ------------------------------------------------- 차트 1 · 달성률 순위
  function renderAchievement(summary, displayMap) {
    var container = el("chart-achievement");
    clear(container);

    var rows = [];
    var skipped = 0;
    summary.policies.forEach(function (item) {
      var display = displayMap[item.policy_code];
      if ((display && display.development_status === "ON_HOLD") || item.achievement_rate === null) {
        skipped += 1;
        return;
      }
      rows.push(item);
    });
    rows.sort(function (a, b) {
      return parseFloat(b.achievement_rate) - parseFloat(a.achievement_rate);
    });

    if (!rows.length) {
      container.appendChild(make("div", "empty",
        "달성률을 계산할 수 있는 정책이 없습니다 (목표율 미설정 또는 계산 보류)."));
      if (skipped) {
        container.appendChild(make("p", "foot-note",
          "표시 제외 " + skipped + "종 — 목표율 미설정 또는 계산 보류."));
      }
      return;
    }

    var maxRate = rows.reduce(function (acc, item) {
      return Math.max(acc, parseFloat(item.achievement_rate));
    }, 0) || 1;

    var table = make("table", "rank");
    var thead = document.createElement("thead");
    var htr = document.createElement("tr");
    ["#", "정책", "달성 정도", "달성률"].forEach(function (label, index) {
      var th = make("th", index === 3 ? "val" : null, label);
      htr.appendChild(th);
    });
    thead.appendChild(htr);
    table.appendChild(thead);

    var tbody = document.createElement("tbody");
    rows.forEach(function (item, index) {
      var level = levelOf(item.achievement_rate);
      var color = levelColor(level);
      var tr = document.createElement("tr");
      tr.appendChild(make("td", "idx", ("0" + (index + 1)).slice(-2)));
      tr.appendChild(make("td", null, item.policy_name));

      var barCell = make("td", "bar-cell");
      var track = make("div", "track");
      var fill = make("span");
      fill.style.width = Math.max(3, (parseFloat(item.achievement_rate) / maxRate) * 100) + "%";
      fill.style.background = color;
      track.appendChild(fill);
      barCell.appendChild(track);
      tr.appendChild(barCell);

      var valCell = make("td", "val");
      var pill = make("span", "pill", item.achievement_rate + "%");
      pill.title = level ? level.label : "";
      pill.style.color = color;
      valCell.appendChild(pill);
      tr.appendChild(valCell);

      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    container.appendChild(table);
    container.appendChild(buildLevelLegend());

    if (skipped) {
      container.appendChild(make("p", "foot-note",
        "표시 제외 " + skipped + "종 — 목표율 미설정 또는 계산 보류."));
    }
  }

  /** 표시 구간 범례. 법정 기준이 아님을 함께 밝힌다. */
  function buildLevelLegend() {
    var wrap = make("div");
    if (!levels) { return wrap; }
    var row = make("div", "legend");
    levels.items.forEach(function (item, index) {
      var span = make("span");
      var dot = make("i");
      dot.style.background = LEVEL_COLOR[index];
      span.appendChild(dot);
      span.appendChild(document.createTextNode(item.label));
      row.appendChild(span);
    });
    wrap.appendChild(row);
    wrap.appendChild(make("p", "foot-note", levels.notice));
    return wrap;
  }

  // ------------------------------------------------- 차트 2 · 적재 건수
  function renderVolume(status) {
    var container = el("chart-volume");
    clear(container);

    var bars = [
      { label: "구매", value: status.purchase_count, key: "--accent" },
      { label: "기업", value: status.company_count, key: "--accent" },
      { label: "인증", value: status.certification_count, key: "--accent" },
      { label: "매칭", value: status.matched_purchase_count, key: "--unset" }
    ];
    if (!bars.some(function (bar) { return bar.value > 0; })) {
      container.appendChild(make("div", "empty", "적재된 데이터가 없습니다."));
      return;
    }

    var width = 320, height = 190, base = 150, slot = width / bars.length;
    var maxValue = bars.reduce(function (a, b) { return Math.max(a, b.value); }, 0) || 1;
    var chart = svg("svg", {
      viewBox: "0 0 " + width + " " + height, width: "100%", height: String(height),
      role: "img", "aria-label": "적재 데이터 건수 막대 차트"
    });
    chart.style.marginTop = "14px";

    bars.forEach(function (bar, index) {
      var barWidth = 26;
      var x = index * slot + (slot - barWidth) / 2;
      var color = cssVar(bar.key);
      chart.appendChild(svg("rect", {
        x: String(x), y: "18", rx: "6",
        width: String(barWidth), height: String(base - 18), fill: cssVar("--track")
      }));
      var h = Math.max(3, (bar.value / maxValue) * (base - 18));
      chart.appendChild(svg("rect", {
        x: String(x), y: String(base - h), rx: "6",
        width: String(barWidth), height: String(h), fill: color
      }));

      var value = svg("text", {
        x: String(x + barWidth / 2), y: String(base - h - 8), "font-size": "11",
        "text-anchor": "middle", fill: cssVar("--text")
      });
      value.textContent = numberFormat(bar.value);
      chart.appendChild(value);

      var label = svg("text", {
        x: String(x + barWidth / 2), y: String(base + 18), "font-size": "11",
        "text-anchor": "middle", fill: cssVar("--muted")
      });
      label.textContent = bar.label;
      chart.appendChild(label);
    });
    container.appendChild(chart);
    container.appendChild(make("p", "foot-note", "전체 데이터 기준 (기간 필터 미적용)"));
  }

  // ------------------------------------------------- 차트 3 · 매칭률 게이지
  function renderGauge(status) {
    var container = el("chart-gauge");
    clear(container);

    if (!status.purchase_count) {
      container.appendChild(make("div", "empty", "구매 데이터가 없습니다."));
      return;
    }

    var ratio = status.matched_purchase_count / status.purchase_count;
    var percent = Math.round(ratio * 1000) / 10;
    var arc = Math.PI * 70;

    var chart = svg("svg", {
      viewBox: "0 0 200 118", width: "100%", height: "150",
      role: "img", "aria-label": "기업 매칭률 게이지 " + percent + "%"
    });
    chart.style.marginTop = "10px";
    var path = "M 30 100 A 70 70 0 0 1 170 100";
    chart.appendChild(svg("path", {
      d: path, fill: "none", stroke: cssVar("--track"),
      "stroke-width": "16", "stroke-linecap": "round"
    }));
    chart.appendChild(svg("path", {
      d: path, fill: "none", stroke: cssVar("--accent"),
      "stroke-width": "16", "stroke-linecap": "round",
      "stroke-dasharray": (arc * ratio) + " " + arc
    }));

    var value = svg("text", {
      x: "100", y: "95", "font-size": "30", "font-weight": "700",
      "text-anchor": "middle", fill: cssVar("--text")
    });
    value.textContent = percent + "%";
    chart.appendChild(value);
    container.appendChild(chart);

    var legend = make("div", "legend");
    [["매칭 완료", status.matched_purchase_count, "--accent"],
     ["미매칭", status.unmatched_purchase_count, "--unset"]].forEach(function (item) {
      var span = make("span");
      var dot = make("i");
      dot.style.background = cssVar(item[2]);
      span.appendChild(dot);
      span.appendChild(document.createTextNode(item[0] + " " + numberFormat(item[1]) + "건"));
      legend.appendChild(span);
    });
    container.appendChild(legend);
  }

  // ------------------------------------------------------------------ 로드
  var lastData = null;

  //: 서버가 내려준 표시 구간표. 경계값을 화면에 하드코딩하지 않는다.
  var levels = null;

  /** 달성률을 표시 구간으로 변환한다(서버가 준 경계만 사용). */
  function levelOf(rate) {
    if (!levels) { return null; }
    if (rate === null || rate === undefined) {
      return { code: levels.not_calculated_code, label: levels.not_calculated_label,
               index: null };
    }
    var value = parseFloat(rate);
    var picked = levels.items[0];
    var index = 0;
    levels.items.forEach(function (item, i) {
      if (value >= parseFloat(item.min_rate)) { picked = item; index = i; }
    });
    return { code: picked.code, label: picked.label, index: index };
  }

  function levelColor(level) {
    if (!level || level.index === null) { return cssVar("--unset"); }
    return LEVEL_COLOR[level.index] || cssVar("--accent");
  }

  function draw(status, summaryResult, displayMap) {
    renderKpi(status);
    renderStatusTable(status);
    renderVolume(status);
    renderGauge(status);

    if (summaryResult.ok) {
      el("summary-error").hidden = true;
      renderPolicies(summaryResult.body, displayMap);
      renderAchievement(summaryResult.body, displayMap);
    } else {
      // 계산 결과가 없어도 정책 목록과 개발 상태는 보여준다.
      var box = el("summary-error");
      box.hidden = false;
      text(box, summaryResult.reason);
      renderPoliciesWithoutCalculation(displayMap);
      clear(el("chart-achievement"));
      el("chart-achievement").appendChild(
        make("div", "empty", "달성률을 계산할 수 없습니다. 위 사유를 확인하세요."));
    }
    text(el("footer-note"),
      "정책별 개발 상태는 docs/DECISIONS.md 의 결정을 그대로 표시합니다.");
  }

  /** 테마를 바꾸면 SVG 색상 변수를 다시 읽어야 하므로 마지막 데이터로 다시 그린다. */
  function redraw() {
    if (lastData) { draw(lastData[0], lastData[1], lastData[2]); }
  }

  function load() {
    var year = el("year-select").value;
    el("error-box").hidden = true;

    // 달성률 계산(summary)은 실패할 수 있다.
    //   · 연도 미지정 → 400 (D-27)
    //   · 연도 귀속 기준일 미확정 → 503 (D-24 · W-1)
    // 이때도 적재 현황·정책 목록은 정상적으로 보여야 하므로, summary 실패를
    // 개별적으로 흡수하고 달성률 영역에만 사유를 표시한다.
    var summaryUrl = "/dashboard/summary?year=" + encodeURIComponent(year);

    Promise.all([
      fetchJson("/dashboard/data-status?year=" + encodeURIComponent(year)),
      fetchJson(summaryUrl).then(
        function (body) { return { ok: true, body: body }; },
        function (err) { return { ok: false, reason: err.message }; }
      ),
      fetchJson("/dashboard/policy-display"),
      fetchJson("/dashboard/achievement-levels")
    ])
      .then(function (results) {
        var displayMap = {};
        results[2].items.forEach(function (item) { displayMap[item.policy_code] = item; });
        levels = results[3];
        lastData = [results[0], results[1], displayMap];
        draw(results[0], results[1], displayMap);
      })
      .catch(function (err) {
        var box = el("error-box");
        box.hidden = false;
        text(box, "데이터를 불러오지 못했습니다: " + err.message);
      });
  }

  /* ---------------------------------------------------------- 업로드
   *
   * ⛔ 업무규칙을 여기에 구현하지 않는다. 이 코드가 하는 일은
   *    "경로를 백엔드에 넘기고, 백엔드가 준 결과를 그리는 것" 뿐이다.
   *    엑셀 해석·검증·판정은 전부 Python 이 한다.
   */
  var uploadPath = null;

  // 대상 기간은 **화면에서 지정**한다. 파일 내용에서 유추하지 않는다.
  // 선택한 연도는 백엔드에서 1/1 ~ 12/31 (D-23 역년)로 환산된다.
  function buildUploadYearOptions() {
    var select = el("upload-year");
    var current = new Date().getFullYear();
    for (var year = current + 1; year >= current - 4; year -= 1) {
      var option = document.createElement("option");
      option.value = String(year);
      option.textContent = String(year);
      if (year === current) { option.selected = true; }
      select.appendChild(option);
    }
  }

  function desktop() {
    return (typeof window.procurementApp === "object") && window.procurementApp !== null;
  }

  function uploadNotice(message) {
    var box = el("upload-notice");
    box.hidden = !message;
    if (message) { text(box, message); }
  }

  function uploadError(message) {
    var box = el("upload-error");
    box.hidden = !message;
    if (message) { text(box, message); }
  }

  function uploadStat(label, value) {
    var node = make("span", "upload-stat");
    var strong = make("b", null, String(value));
    node.appendChild(strong);
    node.appendChild(document.createTextNode(" " + label));
    return node;
  }

  function renderUploadResult(result) {
    var summary = el("upload-summary");
    var issues = el("upload-issues");
    clear(summary);
    clear(issues);

    if (result.file_errors.length) {
      uploadError(result.file_errors.join(" / "));
      summary.hidden = true;
      issues.hidden = true;
      return;
    }
    uploadError("");

    summary.hidden = false;
    summary.appendChild(uploadStat("총 행", numberFormat(result.total_rows)));
    summary.appendChild(uploadStat("정상", numberFormat(result.valid_rows)));
    summary.appendChild(uploadStat("오류 행", numberFormat(result.error_rows)));
    if (result.stored) {
      summary.appendChild(uploadStat("저장", numberFormat(result.stored_rows)));
      if (result.batch_id !== null) {
        summary.appendChild(uploadStat("배치", "#" + result.batch_id));
      }
    }

    // 왜 저장되었는지/되지 않았는지는 **백엔드가 문장으로** 돌려준다.
    // 화면은 상태 표시만 덧붙인다 — 같은 문장을 두 번 쓰지 않기 위함이다.
    uploadNotice(
      (result.stored ? "✅ "
        : result.ok ? "✅ 검증을 모두 통과했습니다. "
        : "⚠️ ")
      + result.storage_note
    );

    if (!result.issues.length) {
      issues.hidden = true;
      return;
    }

    issues.hidden = false;
    var table = document.createElement("table");
    var thead = document.createElement("thead");
    var headRow = document.createElement("tr");
    ["행", "항목", "구분", "내용"].forEach(function (label) {
      headRow.appendChild(make("th", null, label));
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    var tbody = document.createElement("tbody");
    result.issues.forEach(function (issue) {
      var row = document.createElement("tr");
      row.appendChild(make("td", null, issue.row_number + "행"));
      row.appendChild(make("td", null, issue.header || "-"));
      row.appendChild(make(
        "td",
        issue.severity === "error" ? "sev-error" : "sev-warning",
        issue.severity === "error" ? "오류" : "확인"
      ));
      row.appendChild(make("td", "msg", issue.message));
      tbody.appendChild(row);
    });
    table.appendChild(tbody);
    issues.appendChild(table);

    if (result.truncated) {
      issues.appendChild(make("div", "upload-file", "문제가 많아 일부만 표시했습니다."));
    }
  }

  // 업로드 요청 하나를 보내고 결과를 그린다.
  // 검증과 저장은 **엔드포인트만 다르고** 화면 처리는 같다.
  function sendUpload(url, payload, buttons) {
    buttons.forEach(function (button) { button.disabled = true; });
    uploadError("");
    uploadNotice("처리 중입니다...");

    fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify(payload)
    })
      .then(function (res) {
        return res.json().then(function (body) {
          if (!res.ok) {
            throw new Error(body.detail || ("HTTP " + res.status));
          }
          return body;
        });
      })
      .then(function (body) {
        renderUploadResult(body);
        if (body.stored) { load(); }   // 저장되었으면 대시보드를 다시 그린다
      })
      .catch(function (err) {
        uploadNotice("");
        uploadError("처리에 실패했습니다: " + err.message);
      })
      .finally(function () {
        buttons.forEach(function (button) { button.disabled = false; });
      });
  }

  function initUpload() {
    var pick = el("upload-pick");
    var run = el("upload-run");
    var save = el("upload-save");
    var template = el("upload-template");

    buildUploadYearOptions();

    if (!desktop()) {
      pick.disabled = true;
      template.disabled = true;
      uploadNotice("파일 선택과 양식 다운로드는 데스크톱 앱에서 사용할 수 있습니다.");
      return;
    }

    template.addEventListener("click", function () {
      uploadError("");
      window.procurementApp.saveTemplate().then(function (res) {
        if (res.saved) {
          uploadNotice("표준 양식을 저장했습니다: " + res.path);
        } else if (res.message) {
          uploadError(res.message);
        }
      });
    });

    pick.addEventListener("click", function () {
      uploadError("");
      window.procurementApp.selectUploadFile().then(function (res) {
        if (!res.selected) { return; }
        uploadPath = res.path;
        text(el("upload-file"), "선택한 파일: " + res.name);
        run.disabled = false;
        save.disabled = false;
      });
    });

    run.addEventListener("click", function () {
      if (!uploadPath) { return; }
      sendUpload("/uploads/purchases/validate", { file_path: uploadPath }, [run, save]);
    });

    save.addEventListener("click", function () {
      if (!uploadPath) { return; }
      sendUpload(
        "/uploads/purchases",
        { file_path: uploadPath, year: Number(el("upload-year").value) },
        [run, save]
      );
    });
  }

  initTheme();
  buildYearOptions();
  initUpload();
  load();
})();
</script>
</body>
</html>
